<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Words Widget Example</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
      }

      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      input[type="text"] {
        min-width: 16rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid #ccd5e1;
        border-radius: 0.375rem;
      }

      button {
        padding: 0.5rem 0.75rem;
        border: 1px solid #1f2937;
        border-radius: 0.375rem;
        background: #1f2937;
        color: #ffffff;
        cursor: pointer;
      }

      .words-widget {
        padding: 0.75rem 1rem;
        border: 1px solid #ccd5e1;
        border-radius: 0.5rem;
        background: #f8fbff;
        color: #1f2937;
        max-width: 28rem;
      }
    </style>
  </head>
  <body>
    <form id="widget-form">
      <label for="widget-message">Widget text</label>
      <input
        id="widget-message"
        name="message"
        type="text"
        placeholder="Type something"
        value="Embedded in a static HTML page"
      />
      <button type="submit">Show in widget</button>
    </form>

    <div id="widget-target"></div>

    <script src="../src/widget.js"></script>
    <script>
      const target = document.getElementById("widget-target");
      const form = document.getElementById("widget-form");
      const input = document.getElementById("widget-message");

      window.WordsWidget.bindForm(form, input, target);
    </script>
  </body>
</html>
